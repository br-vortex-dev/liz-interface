# ============================================================
#  Render Blueprint — sobe a Liz inteira de uma vez
#  No Render: New > Blueprint > aponta pra este repositório.
#
#  Serviços:
#   - liz-api : backend Express (Web Service, Node)
#   - liz     : frontend estático (Static Site)
#
#  As env vars com "sync: false" você preenche no painel do
#  Render depois (segredos — nunca commite valores reais).
# ============================================================

services:
  # ---------- Backend (API) ----------
  - type: web
    name: liz-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Origens aceitas pela API (a URL do frontend na nuvem + dev local)
      - key: CORS_ORIGIN
        value: https://liz.onrender.com,http://localhost:8321,http://127.0.0.1:8321
      # Postgres da Supabase (Settings > Database > Connection string)
      - key: DATABASE_URL
        sync: false
      # Provedor de IA (os mesmos valores do backend/.env local)
      - key: AI_API_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_MAX_TOKENS
        sync: false
      # Firebase (tela de login) — mesmos valores do backend/.env local
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      # Cliente OAuth Web (Google Auth Platform) p/ login Google sem popup
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false

  # ---------- Frontend (site estático) ----------
  - type: static
    name: liz
    buildCommand: node frontend/scripts/build-frontend.js
    publishDir: frontend/public
