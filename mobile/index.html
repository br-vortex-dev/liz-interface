<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Liz — sua assistente com inteligência artificial." />
  <title>Liz</title>
  <link rel="icon" type="image/svg+xml" href="../coroa.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css?v=20260722" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="stylesheet" href="css/panels.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="../css/mural.css" />
</head>
<body>
  <div class="app">

    <!-- ===================================================
         SVGs DECORATIVOS — formas geométricas flutuantes
         (mesma linguagem visual do desktop)
    ==================================================== -->
    <svg class="bg-deco" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
         style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0.5">
      <polygon class="deco-hex" points="320,80 355,100 355,140 320,160 285,140 285,100"
               fill="none" stroke="rgba(139,92,246,0.06)" stroke-width="1"/>
      <circle cx="60" cy="700" r="25" fill="none" stroke="rgba(139,92,246,0.05)" stroke-width="1"/>
      <polygon points="340,650 355,680 325,680" fill="none" stroke="rgba(139,92,246,0.04)" stroke-width="1"/>
      <rect x="40" y="180" width="18" height="18" rx="3" transform="rotate(45 49 189)"
            fill="none" stroke="rgba(139,92,246,0.04)" stroke-width="1"/>
    </svg>

    <!-- Header — coroa maior que abre o menu -->
    <header class="header">
      <button class="header-crown-btn" id="crownToggle" aria-label="Mostrar ferramentas">
        <span class="header-crown-liz" id="hc"></span>
      </button>
      <button class="header-back" id="backBtn" aria-label="Voltar" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="header-title" id="ht">Liz</span>
      <span class="header-sep" id="hSep" style="display:none">·</span>
      <span class="header-sub" id="hSub"></span>
      <div class="header-right">
        <button class="header-theme" id="tb" aria-label="Tema"></button>
        <button class="header-close-btn" id="closeBtn" aria-label="Fechar" style="visibility:hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </header>

    <!-- Dock de ferramentas — flutuante, vidro -->
    <div class="tools-bar">
      <button class="tool-pill" data-t="newchat" aria-label="Novo chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <button class="tool-pill is-active" data-t="chat" aria-label="Chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
      <button class="tool-pill" data-t="archive" aria-label="Arquivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
      <button class="tool-pill" data-t="tools" aria-label="Ferramentas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.1-2.1z"/></svg></button>
      <button class="tool-pill" data-t="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>

    <!-- Pages -->
    <main class="main">

      <div class="page is-active" id="pChat">
        <div class="chat-page">
          <div class="chat-content" id="chatContent">
            <div class="empty" id="empty">
              <div class="empty-crown" id="ec"></div>
              <h2 class="empty-t">Liz</h2>
              <p class="empty-s">Como posso te ajudar?</p>
              <div class="chips" id="ch">
                <button class="chip" data-m="code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> Código</button>
                <button class="chip" data-m="design"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></svg> Design</button>
                <button class="chip" data-m="errors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="6" width="8" height="14" rx="4"/><path d="M9 6V4a3 3 0 0 1 6 0v2"/></svg> Erros</button>
                <button class="chip" data-m="ideas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg> Ideias</button>
              </div>
            </div>
            <div class="msg-list is-hidden" id="ml"></div>
          </div>
          <div class="composer-wrap composer-fixed">
            <form class="composer" id="cf">
              <textarea class="composer-input" id="ci" rows="1" placeholder="Mensagem para a Liz..." aria-label="Mensagem"></textarea>
              <button class="composer-send" id="sb" type="submit" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
            </form>
          </div>
        </div>
      </div>

      <div class="page" id="pSettings"></div>
      <div class="page" id="pTools"></div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modal">
        <div class="modal-head">
          <h3 class="modal-title" id="modalTitle">Título</h3>
          <button class="modal-close" id="modalClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- File input -->
    <input type="file" id="fi" hidden multiple>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/ui-core.js"></script>
  <script src="../js/mural.js"></script>
  <script src="js/mobile.js"></script>
</body>
</html>
